name: CI

on:
  pull_request:
  push:
    branches: [main, codex/grett-v2]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm run test:rules
      - run: npm ci
        working-directory: functions
      - run: npm run check
        working-directory: functions
