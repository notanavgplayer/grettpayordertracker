<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
  .cal-wrap { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px;
  }
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-nav-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: all 0.15s; font-family: 'IBM Plex Sans', sans-serif;
  }
  .cal-nav-btn:hover { border-color: var(--navy3); color: var(--navy); }
  .cal-month-label { font-size: 18px; font-weight: 600; color: var(--navy); min-width: 180px; text-align: center; }
  .cal-today-btn {
    padding: 6px 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer;
    transition: all 0.15s;
  }
  .cal-today-btn:hover { border-color: var(--navy3); color: var(--navy); }

  .cal-legend {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .cal-legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--muted);
  }
  .cal-legend-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  /* ── CALENDAR GRID ── */
  .cal-grid-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden;
    margin-bottom: 1.25rem;
  }
  .cal-day-headers {
    display: grid; grid-template-columns: repeat(7, 1fr);
    background: var(--navy);
  }
  .cal-day-header {
    text-align: center; padding: 10px 4px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(255,255,255,0.6);
  }
  .cal-days {
    display: grid; grid-template-columns: repeat(7, 1fr);
  }
  .cal-cell {
    min-height: 90px; padding: 6px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    position: relative; vertical-align: top;
    transition: background 0.1s;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.other-month { background: var(--bg); opacity: 0.4; }
  .cal-cell.today { background: #f0f7ff; }
  .cal-cell.today .cal-date {
    background: var(--navy); color: #fff;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .cal-date {
    font-size: 12px; font-weight: 500; color: var(--muted);
    margin-bottom: 4px; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-event {
    font-size: 10px; font-weight: 500;
    padding: 2px 5px; border-radius: 4px;
    margin-bottom: 2px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity 0.1s;
  }
  .cal-event:hover { opacity: 0.8; }
  .cal-event.submission { background: #fdf3dc; color: #7a4500; border-left: 2px solid var(--amber); }
  .cal-event.opening    { background: var(--blue-bg); color: var(--blue-fg); border-left: 2px solid var(--blue-fg); }
  .cal-event.expiry     { background: var(--red-bg);  color: var(--red-fg);  border-left: 2px solid var(--red-fg); }
  .cal-event.custom     { background: var(--purple-bg); color: var(--purple-fg); border-left: 2px solid var(--purple-fg); }

  /* Clickable cells */
  .cal-cell.current-month { cursor: pointer; }
  .cal-cell.current-month:hover { background: var(--bg); }

  /* Add event button */
  .cal-add-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 600; color: var(--muted);
    cursor: pointer; transition: all 0.15s; margin-left: auto;
  }
  .cal-add-btn:hover { border-color: var(--navy3); color: var(--navy); }

  /* Day detail events list */
  .day-event-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .day-event-item:last-child { border-bottom: none; }
  .day-event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .day-event-info { flex: 1; min-width: 0; }
  .day-event-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .day-event-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .day-event-edit {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    width: 28px; height: 28px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; color: var(--muted);
    transition: all 0.15s; flex-shrink: 0;
  }
  .day-event-edit:hover { border-color: var(--navy3); color: var(--navy); }
  .day-no-events { font-size: 13px; color: var(--muted); text-align: center; padding: 1rem 0; }

  /* ── UPCOMING LIST ── */
  .upcoming-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .upcoming-header {
    padding: 12px 16px; background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted);
  }
  .upcoming-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px; border-bottom: 1px solid var(--border);
    text-decoration: none; transition: background 0.1s; cursor: pointer;
  }
  .upcoming-item:last-child { border-bottom: none; }
  .upcoming-item:hover { background: var(--bg); }
  .upcoming-date-box {
    width: 44px; text-align: center; flex-shrink: 0;
  }
  .upcoming-date-day  { font-size: 20px; font-weight: 700; color: var(--navy); font-family: 'IBM Plex Mono', monospace; line-height: 1; }
  .upcoming-date-month{ font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .upcoming-divider   { width: 1px; height: 36px; background: var(--border); flex-shrink: 0; }
  .upcoming-info      { flex: 1; min-width: 0; }
  .upcoming-name      { font-size: 13px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .upcoming-meta      { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .upcoming-badge     { flex-shrink: 0; }

  /* ── TOOLTIP ── */
  .cal-tooltip {
    position: fixed; z-index: 500;
    background: var(--navy); color: #fff;
    padding: 8px 12px; border-radius: 8px;
    font-size: 12px; max-width: 220px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    pointer-events: none; display: none;
    line-height: 1.5;
  }
  .cal-tooltip strong { display: block; font-size: 13px; margin-bottom: 2px; }

  @media (max-width: 600px) {
    .cal-cell { min-height: 60px; }
    .cal-event { font-size: 9px; padding: 1px 3px; }
  }

  /* Dark mode calendar */
  [data-theme="dark"] .cal-day-headers { background: #1a2332; }
  [data-theme="dark"] .cal-day-header { color: rgba(255,255,255,0.5); }
  [data-theme="dark"] .cal-cell { border-color: var(--border); }
  [data-theme="dark"] .cal-cell.today { background: rgba(88,166,255,0.08); }
  [data-theme="dark"] .cal-cell.today .cal-date { background: var(--amber); color: #0d1117; }
  [data-theme="dark"] .cal-cell.other-month { background: #0a0e14; }
  [data-theme="dark"] .cal-cell.current-month:hover { background: rgba(255,255,255,0.04); }
  [data-theme="dark"] .cal-tooltip { background: #1a2332; color: #e0e6ed; }
</style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0f2a4a">
</head>
<body data-page="calendar">
<div id="page-content">
<div class="cal-wrap">

  <div class="cal-header">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="cal-month-label" id="calMonthLabel">—</span>
      <button class="cal-nav-btn" onclick="changeMonth(1)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="cal-today-btn" onclick="goToday()">Today</button>
    </div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#e8940a"></div>Submission</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#185fa5"></div>Opening</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#c0392b"></div>PO Expiry</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#5d3fa5"></div>Custom</div>
      <button class="cal-add-btn" onclick="openEventModal()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add Event
      </button>
    </div>
  </div>

  <div class="cal-grid-wrap">
    <div class="cal-day-headers">
      <div class="cal-day-header">Sun</div>
      <div class="cal-day-header">Mon</div>
      <div class="cal-day-header">Tue</div>
      <div class="cal-day-header">Wed</div>
      <div class="cal-day-header">Thu</div>
      <div class="cal-day-header">Fri</div>
      <div class="cal-day-header">Sat</div>
    </div>
    <div class="cal-days" id="calDays"></div>
  </div>

  <div class="upcoming-section">
    <div class="upcoming-header">Upcoming This Month</div>
    <div id="upcomingList"></div>
  </div>

</div>
</div>

<!-- DAY DETAIL PANEL (shows when you click a date) -->
<div class="modal-overlay" id="dayDetailOverlay">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <span id="dayDetailTitle">—</span>
      <button class="modal-close" onclick="closeDayDetail()">&#x2715;</button>
    </div>
    <div id="dayDetailEvents" style="margin-bottom:1rem"></div>
    <button class="btn-primary" style="width:100%" onclick="closeDayDetail();openEventModal(document.getElementById('dayDetailOverlay').dataset.date)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add Event on This Date
    </button>
  </div>
</div>

<!-- ADD/EDIT EVENT MODAL -->
<div class="modal-overlay" id="eventModalOverlay">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <span id="eventModalTitle">New Event</span>
      <button class="modal-close" onclick="closeEventModal()">&#x2715;</button>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div class="form-group">
        <label>Event Title</label>
        <input type="text" id="ev_title" placeholder="e.g. Submit tender documents">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="ev_date">
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="ev_type">
          <option value="deadline">Deadline</option>
          <option value="meeting">Meeting</option>
          <option value="reminder">Reminder</option>
          <option value="site-visit">Site Visit</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea id="ev_notes" placeholder="Any additional details…" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEventModal()">Cancel</button>
      <button class="btn-danger" id="evDeleteBtn" onclick="deleteEvent()" style="display:none">Delete</button>
      <button class="btn-save" id="evSaveBtn" onclick="saveEvent()">Save Event</button>
    </div>
  </div>
</div>

<div class="cal-tooltip" id="calTooltip"></div>
<div class="toast" id="toast"></div>
<script type="module" src="calendar.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
