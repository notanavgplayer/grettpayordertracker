[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA routing — React Router handles all paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed static assets — immutable, cache for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PWA manifest — short cache
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML shell — always revalidate so users get the latest app shell
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # script-src: 'unsafe-inline' removed. The single inline script in
    # index.html (theme-FOUC guard) is whitelisted by its sha256 hash.
    # If you edit that script, run npm run check:csp and update this hash.
    # TODO: drop 'unsafe-inline' from style-src once Tailwind/runtime inline
    # styles are eliminated or hashed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Bkej5L8+KdWf0xmqUGBoeE8Y9h/1JgyiIo3j0JTiGfw=' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.cloudfunctions.net https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.supabase.co wss://*.firebaseio.com; frame-src https://*.firebaseapp.com; base-uri 'self'; object-src 'none'; form-action 'self'"
