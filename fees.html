<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tender Fees — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="layout.css" as="style">
<link rel="preload" href="style.css" as="style">
<link rel="modulepreload" href="firebase-config.js">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
  .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
  .skeleton-card{height:72px;margin-bottom:12px;border-radius:10px}
  .skeleton-line{height:14px;margin-bottom:10px}
  .skeleton-line:last-child{width:60%}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  [data-theme="dark"] .skeleton{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%}
</style>
<style>
  .fees-wrap { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

  .fees-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px;
  }
  .fees-header h1 { font-size: 20px; font-weight: 600; color: var(--navy); }
  .fees-header p  { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .fees-cards {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 1.5rem;
  }
  .fee-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1rem 1.1rem;
    border-top: 3px solid var(--border);
  }
  .fee-card.navy  { border-top-color: var(--navy); }
  .fee-card.amber { border-top-color: var(--amber); }
  .fee-card.green { border-top-color: #1d9e75; }
  .fee-card.blue  { border-top-color: var(--blue-fg); }
  .fee-card-label { font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .fee-card-val   { font-size: 19px; font-weight: 600; color: var(--navy); font-family: 'IBM Plex Mono', monospace; }
  .fee-card.amber .fee-card-val { color: var(--amber-fg); }
  .fee-card.green .fee-card-val { color: var(--green-fg); }
  .fee-card.blue  .fee-card-val { color: var(--blue-fg); }

  .fees-toolbar {
    display: flex; gap: 8px; margin-bottom: 1rem;
    align-items: center; flex-wrap: wrap;
  }
  .fees-filter-btn {
    padding: 5px 14px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 12px; font-weight: 500; color: var(--muted);
    cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
    transition: all 0.15s;
  }
  .fees-filter-btn.active, .fees-filter-btn:hover {
    background: var(--navy); color: #fff; border-color: var(--navy);
  }

  .fees-table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow-x: auto;
  }
  .fees-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .fees-table th {
    padding: 10px 14px; text-align: left;
    font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: rgba(255,255,255,0.8);
    background: var(--navy); white-space: nowrap;
  }
  .fees-table th.num { text-align: right; }
  .fees-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .fees-table tr:last-child td { border-bottom: none; }
  .fees-table tr:hover td { background: #f7fafc; }
  .fee-tender-name { font-weight: 500; color: var(--navy); max-width: 220px; }
  .fee-receipt { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
  .fee-amount  { font-family: 'IBM Plex Mono', monospace; font-weight: 600; text-align: right; }
  .fee-date    { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .fees-empty { text-align: center; padding: 3rem; color: var(--muted); }
  .fees-empty p { font-size: 14px; font-weight: 500; color: var(--text); margin-top: 10px; }

  .b-refunded { background: #f0eef8; color: var(--purple-fg); }
</style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0f2a4a">
</head>
<body data-page="fees">
<div id="page-content">
<div class="fees-wrap">

  <div class="fees-header">
    <div>
      <h1>Tender Fee Register</h1>
      <p>Track fees paid to purchase tender documents from procuring agencies.</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-primary" style="background:var(--navy2);display:flex;align-items:center;gap:6px" onclick="exportFeesPDF()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 5l3 3 3-3M1 9v1a1 1 0 001 1h8a1 1 0 001-1V9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export PDF
      </button>
      <button class="btn-primary" onclick="openFeeModal()">+ Add Fee</button>
    </div>
  </div>

  <div class="fees-cards">
    <div class="fee-card navy"><div class="fee-card-label">Total Paid</div><div class="fee-card-val" id="fcTotal">—</div></div>
    <div class="fee-card amber"><div class="fee-card-label">This Month</div><div class="fee-card-val" id="fcMonth">—</div></div>
    <div class="fee-card green"><div class="fee-card-label">Refunded</div><div class="fee-card-val" id="fcRefunded">—</div></div>
    <div class="fee-card blue"><div class="fee-card-label">Total Entries</div><div class="fee-card-val" id="fcCount">—</div></div>
  </div>

  <div class="fees-toolbar">
    <button class="fees-filter-btn active" onclick="setFeeFilter('all',this)">All</button>
    <button class="fees-filter-btn" onclick="setFeeFilter('Paid',this)">Paid</button>
    <button class="fees-filter-btn" onclick="setFeeFilter('Pending',this)">Pending</button>
    <button class="fees-filter-btn" onclick="setFeeFilter('Refunded',this)">Refunded</button>
    <div style="margin-left:auto">
      <input type="text" id="feeSearch" placeholder="Search tender / agency…"
        style="padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:IBM Plex Sans,sans-serif;font-size:13px;background:var(--surface);outline:none;width:220px"
        oninput="renderFeeTable()">
    </div>
  </div>

  <div class="fees-table-wrap">
    <table class="fees-table">
      <thead><tr>
        <th>Tender / Project</th>
        <th>Agency</th>
        <th>NIT / Ref</th>
        <th>Receipt No.</th>
        <th>Date</th>
        <th class="num">Amount (PKR)</th>
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody id="feeTbody"></tbody>
    </table>
    <div class="fees-empty" id="feesEmpty" style="display:none">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" style="opacity:0.25"><rect x="8" y="6" width="28" height="32" rx="3" stroke="#0f2a4a" stroke-width="2"/><path d="M14 16h16M14 22h16M14 28h10" stroke="#0f2a4a" stroke-width="2" stroke-linecap="round"/></svg>
      <p>No fees recorded yet</p>
    </div>
  </div>

</div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="feeModal">
  <div class="modal" style="max-width:500px">
    <div class="modal-header">
      <span id="feeModalTitle">Add Tender Fee</span>
      <button class="modal-close" onclick="closeFeeModal()">&#x2715;</button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Tender / Project Name</label>
        <input type="text" id="ff_tender" placeholder="e.g. Supply of LED Street Lights">
      </div>
      <div class="form-group">
        <label>Procuring Agency</label>
        <input type="text" id="ff_agency" placeholder="e.g. KMC, NHA">
      </div>
      <div class="form-group">
        <label>NIT / Reference No.</label>
        <input type="text" id="ff_nit" placeholder="e.g. NIT-KMC-2024-041">
      </div>
      <div class="form-group">
        <label>Amount (PKR)</label>
        <input type="number" id="ff_amount" placeholder="0">
      </div>
      <div class="form-group">
        <label>Date Paid</label>
        <input type="date" id="ff_date">
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select id="ff_method">
          <option value="Pay Order">Pay Order</option>
          <option value="Cash">Cash</option>
          <option value="Online Transfer">Online Transfer</option>
          <option value="Bank Draft">Bank Draft</option>
          <option value="Cheque">Cheque</option>
          
        </select>
      </div>
      <div class="form-group">
        <label>Receipt No. (optional)</label>
        <input type="text" id="ff_receipt" placeholder="e.g. RCP-2024-001">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="ff_status">
          <option value="Paid">Paid</option>
          <option value="Pending">Pending</option>
          <option value="Refunded">Refunded</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Notes (optional)</label>
        <input type="text" id="ff_note" placeholder="Any extra details…">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeFeeModal()">Cancel</button>
      <button class="btn-save" id="feeSaveBtn" onclick="saveFee()">Save</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="modal-overlay" id="feeConfirmOverlay">
  <div class="modal confirm-modal">
    <div class="confirm-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h3>Delete this entry?</h3>
    <p>This cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeFeeConfirm()">Cancel</button>
      <button class="btn-danger" onclick="confirmFeeDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="fees.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
