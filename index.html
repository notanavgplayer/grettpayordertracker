<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grett Engineering — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:    #0f2a4a;
    --navy2:   #1a3f6f;
    --amber:   #e8940a;
    --bg:      #f0f4f8;
    --surface: #ffffff;
    --border:  #dce3ed;
    --text:    #0f2a4a;
    --muted:   #6b7a90;
    --danger:  #c0392b;
    --radius:  10px;
  }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(15,42,74,0.10);
  }
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 2rem;
  }
  .logo-mark {
    width: 44px; height: 44px;
    background: var(--navy);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark svg { width: 24px; height: 24px; }
  .logo-text { line-height: 1.2; }
  .logo-text strong { display: block; font-size: 15px; font-weight: 600; color: var(--navy); }
  .logo-text span { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.05em; }
  h1 { font-size: 22px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 1.75rem; }
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px; color: var(--text);
    background: #fafbfc; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  input:focus { border-color: var(--navy2); background: #fff; }
  .btn {
    width: 100%; padding: 11px;
    background: var(--navy);
    color: #fff; border: none;
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 0.5rem;
    transition: background 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { background: var(--navy2); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    background: #fdf0ef; border: 1px solid #f5c4c4;
    border-radius: var(--radius); padding: 10px 12px;
    font-size: 13px; color: var(--danger);
    margin-top: 1rem; display: none;
  }
  .error.show { display: block; }
  .divider { text-align: center; font-size: 11px; color: var(--muted); margin: 1.5rem 0 1rem; }
  .lock-note {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    background: #f4f6f9; border-radius: 8px;
    padding: 10px 12px; margin-top: 1.5rem;
  }
  .lock-note svg { flex-shrink: 0; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 8v2h2v10h4v-5h6v5h4V10h2V8L12 2z" fill="#e8940a"/>
      </svg>
    </div>
    <div class="logo-text">
      <strong>Grett Engineering Solutions</strong>
      <span>PAY ORDER TRACKER</span>
    </div>
  </div>

  <h1>Sign in</h1>
  <p class="subtitle">Restricted access — authorized personnel only.</p>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" id="loginBtn" onclick="handleLogin()">
    <span id="btnText">Sign In</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="error" id="errorMsg"></div>

  <div class="lock-note">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="6" width="10" height="7" rx="1.5" stroke="#6b7a90" stroke-width="1.2"/><path d="M4.5 6V4.5a2.5 2.5 0 015 0V6" stroke="#6b7a90" stroke-width="1.2" stroke-linecap="round"/></svg>
    Access is secured by Firebase Authentication. Contact the administrator to get access.
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import firebaseConfig from "./firebase-config.js";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, user => {
  if (user) window.location.href = "home.html";
});

window.handleLogin = async function() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const txt      = document.getElementById('btnText');
  const spin     = document.getElementById('spinner');
  const err      = document.getElementById('errorMsg');

  if (!email || !password) { showError("Please enter your email and password."); return; }

  btn.disabled = true; txt.textContent = 'Signing in…'; spin.style.display = 'block';
  err.classList.remove('show');

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "home.html";
  } catch (e) {
    const messages = {
      'auth/user-not-found':   'No account found with this email.',
      'auth/wrong-password':   'Incorrect password. Please try again.',
      'auth/invalid-email':    'Please enter a valid email address.',
      'auth/too-many-requests':'Too many attempts. Please wait a moment.',
      'auth/invalid-credential': 'Invalid email or password.',
    };
    showError(messages[e.code] || 'Sign in failed. Please try again.');
  } finally {
    btn.disabled = false; txt.textContent = 'Sign In'; spin.style.display = 'none';
  }
};

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.classList.add('show');
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') window.handleLogin(); });
</script>
</body>
</html>
