<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F6F8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Grett Pay Order Tracker — manage tenders, pay orders, expenses, contacts, and project deadlines in one place." />
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <!-- Open Graph -->
    <meta property="og:title" content="Grett Pay Order Tracker" />
    <meta property="og:description" content="Manage tenders, pay orders, expenses, contacts, and project deadlines in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:url" content="https://grettpayordertracker.netlify.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grett Pay Order Tracker" />
    <meta name="twitter:description" content="Manage tenders, pay orders, expenses, contacts, and project deadlines in one place." />
    <meta name="twitter:image" content="/og.svg" />

    <link rel="canonical" href="https://grettpayordertracker.netlify.app/" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Grett Pay Order Tracker</title>

    <!-- Firebase preconnects -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebaseinstallations.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!-- Inter (body/UI) + Figtree (display/headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Inline theme detection to avoid FOUC -->
    <script>
      try {
        const savedTheme = localStorage.getItem('grett-theme');
        const useDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (useDark)
          document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', useDark ? '#101820' : '#F3F6F8');
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
