<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="layout.css" as="style">
<link rel="preload" href="style.css" as="style">
<link rel="modulepreload" href="firebase-config.js">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
  .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
  .skeleton-card{height:72px;margin-bottom:12px;border-radius:10px}
  .skeleton-line{height:14px;margin-bottom:10px}
  .skeleton-line:last-child{width:60%}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  [data-theme="dark"] .skeleton{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%}
</style>
<style>
  .activity-wrap { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

  .activity-page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px;
  }
  .activity-page-header h1 { font-size: 20px; font-weight: 600; color: var(--navy); }

  /* ── FILTERS ── */
  .activity-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .af-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 500; color: var(--muted);
    cursor: pointer; transition: all 0.15s;
  }
  .af-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .af-btn:hover:not(.active) { border-color: var(--navy3); color: var(--navy); }
  .af-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ── TIMELINE ── */
  .timeline { position: relative; padding-left: 32px; }
  .timeline::before {
    content: ''; position: absolute;
    left: 11px; top: 0; bottom: 0;
    width: 2px; background: var(--border);
    border-radius: 2px;
  }

  .timeline-day { margin-bottom: 1.5rem; }
  .timeline-day-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
    position: relative; left: -32px;
    padding-left: 32px;
  }
  .timeline-day-label::before {
    content: ''; display: block;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
    position: absolute; left: 8px;
  }

  .timeline-event {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 12px 14px;
    margin-bottom: 8px; transition: box-shadow 0.1s;
    text-decoration: none; cursor: default;
    position: relative;
  }
  .timeline-event.clickable { cursor: pointer; }
  .timeline-event.clickable:hover { box-shadow: 0 2px 10px rgba(15,42,74,0.08); border-color: #b8cce0; }

  .event-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .event-icon svg { width: 14px; height: 14px; }
  .ei-tender   { background: var(--blue-bg);   color: var(--blue-fg); }
  .ei-po       { background: var(--amber-bg);  color: var(--amber-fg); }
  .ei-note     { background: var(--purple-bg); color: var(--purple-fg); }
  .ei-todo     { background: var(--green-bg);  color: var(--green-fg); }
  .ei-expense  { background: var(--red-bg);    color: var(--red-fg); }
  .ei-contact  { background: #f0f4ff;          color: #4361ee; }
  .ei-fee      { background: var(--amber-bg);  color: var(--amber-fg); }

  .event-body { flex: 1; min-width: 0; }
  .event-text { font-size: 13px; color: var(--text); line-height: 1.4; margin-bottom: 3px; }
  .event-text strong { font-weight: 600; color: var(--navy); }
  .event-time {
    font-size: 11px; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .event-badge { flex-shrink: 0; }

  .timeline-empty {
    text-align: center; padding: 4rem 2rem; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }
  .timeline-empty svg { opacity: 0.25; margin-bottom: 10px; }
  .timeline-empty p { font-size: 14px; font-weight: 500; color: var(--text); }

  .load-more-btn {
    width: 100%; padding: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; font-weight: 500; color: var(--muted);
    transition: all 0.15s; margin-top: 8px;
  }
  .load-more-btn:hover { background: var(--bg); color: var(--navy); }
</style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0f2a4a">
</head>
<body data-page="activity">
<div id="page-content">
<div class="activity-wrap">

  <div class="activity-page-header">
    <h1>Activity Timeline</h1>
    <div class="activity-filters">
      <button class="af-btn active" onclick="setAFilter('all',this)">All</button>
      <button class="af-btn" onclick="setAFilter('tender',this)">
        <span class="af-dot" style="background:#185fa5"></span>Tenders
      </button>
      <button class="af-btn" onclick="setAFilter('po',this)">
        <span class="af-dot" style="background:#e8940a"></span>Pay Orders
      </button>
      <button class="af-btn" onclick="setAFilter('note',this)">
        <span class="af-dot" style="background:#5d3fa5"></span>Notes
      </button>
      <button class="af-btn" onclick="setAFilter('todo',this)">
        <span class="af-dot" style="background:#0e6b4a"></span>To-Do
      </button>
      <button class="af-btn" onclick="setAFilter('expense',this)">
        <span class="af-dot" style="background:#c0392b"></span>Expenses
      </button>
      <button class="af-btn" onclick="setAFilter('fee',this)">
        <span class="af-dot" style="background:#e8940a"></span>Tender Fees
      </button>
    </div>
  </div>

  <div id="timelineContainer"></div>

</div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="activity.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
