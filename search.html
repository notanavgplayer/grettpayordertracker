<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
  .search-wrap { max-width: 820px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

  /* ── SEARCH BAR ── */
  .global-search-bar {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 1.5rem;
    transition: border-color 0.15s;
    box-shadow: 0 2px 12px rgba(15,42,74,0.07);
  }
  .global-search-bar:focus-within { border-color: var(--navy); }
  .global-search-bar svg { color: var(--muted); flex-shrink: 0; }
  .global-search-input {
    flex: 1; border: none; outline: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px; color: var(--text);
    background: transparent;
  }
  .global-search-input::placeholder { color: #c8d3e0; }
  .search-clear {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--border); border: none;
    cursor: pointer; display: none; align-items: center; justify-content: center;
    color: var(--muted); transition: background 0.15s; font-size: 14px; line-height: 1;
  }
  .search-clear.show { display: flex; }
  .search-clear:hover { background: var(--navy); color: #fff; }

  /* ── FILTER PILLS ── */
  .search-filters {
    display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap;
  }
  .sf-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 500; color: var(--muted);
    cursor: pointer; transition: all 0.15s;
  }
  .sf-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .sf-btn:hover:not(.active) { border-color: var(--navy3); color: var(--navy); }
  .sf-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ── RESULTS ── */
  .search-state {
    text-align: center; padding: 3rem 1rem; color: var(--muted);
  }
  .search-state svg { margin-bottom: 10px; opacity: 0.2; }
  .search-state p { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .search-state span { font-size: 13px; }

  .results-count {
    font-size: 12px; color: var(--muted); margin-bottom: 1rem;
    font-family: 'IBM Plex Mono', monospace;
  }
  .results-count strong { color: var(--navy); }

  .result-group { margin-bottom: 1.5rem; }
  .result-group-header {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .result-group-icon {
    width: 20px; height: 20px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .result-group-icon svg { width: 11px; height: 11px; }
  .rgi-tender   { background: var(--blue-bg);   color: var(--blue-fg); }
  .rgi-po       { background: var(--amber-bg);  color: var(--amber-fg); }
  .rgi-note     { background: var(--purple-bg); color: var(--purple-fg); }
  .rgi-todo     { background: var(--green-bg);  color: var(--green-fg); }
  .rgi-expense  { background: var(--red-bg);    color: var(--red-fg); }

  .result-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); margin-bottom: 6px;
    cursor: pointer; text-decoration: none;
    transition: all 0.1s;
  }
  .result-item:hover { border-color: var(--navy3); box-shadow: 0 2px 8px rgba(15,42,74,0.08); }
  .result-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .result-icon svg { width: 16px; height: 16px; }
  .ri-tender  { background: var(--blue-bg);   color: var(--blue-fg); }
  .ri-po      { background: var(--amber-bg);  color: var(--amber-fg); }
  .ri-note    { background: var(--purple-bg); color: var(--purple-fg); }
  .ri-todo    { background: var(--green-bg);  color: var(--green-fg); }
  .ri-expense { background: var(--red-bg);    color: var(--red-fg); }

  .result-body { flex: 1; min-width: 0; }
  .result-title {
    font-size: 13px; font-weight: 500; color: var(--navy);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .result-title mark {
    background: #fff3cd; color: var(--navy);
    border-radius: 2px; padding: 0 1px;
  }
  .result-sub  { font-size: 11px; color: var(--muted); }
  .result-meta { flex-shrink: 0; text-align: right; }
  .result-badge { font-size: 10px; }
  .result-arrow { color: var(--muted); margin-left: 4px; }
</style>
</head>
<body data-page="search">
<div id="page-content">
<div class="search-wrap">

  <!-- SEARCH BAR -->
  <div class="global-search-bar">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/>
      <path d="M14 14l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input class="global-search-input" id="globalSearch" type="text"
      placeholder="Search tenders, pay orders, notes, expenses…"
      oninput="onSearchInput()" autocomplete="off" autofocus>
    <button class="search-clear" id="searchClear" onclick="clearSearch()">&#x2715;</button>
  </div>

  <!-- FILTER PILLS -->
  <div class="search-filters">
    <button class="sf-btn active" onclick="setSFilter('all', this)">All</button>
    <button class="sf-btn" onclick="setSFilter('tender', this)">
      <span class="sf-dot" style="background:#185fa5"></span>Tenders
    </button>
    <button class="sf-btn" onclick="setSFilter('po', this)">
      <span class="sf-dot" style="background:#e8940a"></span>Pay Orders
    </button>
    <button class="sf-btn" onclick="setSFilter('note', this)">
      <span class="sf-dot" style="background:#5d3fa5"></span>Notes
    </button>
    <button class="sf-btn" onclick="setSFilter('todo', this)">
      <span class="sf-dot" style="background:#0e6b4a"></span>To-Do
    </button>
    <button class="sf-btn" onclick="setSFilter('expense', this)">
      <span class="sf-dot" style="background:#c0392b"></span>Expenses
    </button>
  </div>

  <!-- RESULTS -->
  <div id="searchResults">
    <div class="search-state">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="22" cy="22" r="14" stroke="#c8d3e0" stroke-width="2.5"/>
        <path d="M32 32l8 8" stroke="#c8d3e0" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p>Search across everything</p>
      <span>Type to search tenders, pay orders, notes, to-dos, and expenses</span>
    </div>
  </div>

</div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="search.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
