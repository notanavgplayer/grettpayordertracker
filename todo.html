<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="layout.css" as="style">
<link rel="preload" href="style.css" as="style">
<link rel="modulepreload" href="firebase-config.js">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
  .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
  .skeleton-card{height:72px;margin-bottom:12px;border-radius:10px}
  .skeleton-line{height:14px;margin-bottom:10px}
  .skeleton-line:last-child{width:60%}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  [data-theme="dark"] .skeleton{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%}
</style>
<style>
  .todo-wrap { max-width: 720px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

  .todo-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px;
  }
  .todo-header-left h1 { font-size: 20px; font-weight: 600; color: var(--navy); }
  .todo-header-left p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .todo-stats { display: flex; gap: 10px; }
  .todo-stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 14px;
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .todo-stat strong { color: var(--navy); font-weight: 600; font-family: 'IBM Plex Mono', monospace; }

  /* ADD TASK BAR */
  .add-task-bar {
    display: flex; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 10px 12px;
    margin-bottom: 1rem;
    align-items: center;
    transition: border-color 0.15s;
    box-shadow: 0 1px 4px rgba(15,42,74,0.05);
  }
  .add-task-bar:focus-within { border-color: var(--navy3); }
  .add-task-input {
    flex: 1; border: none; outline: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px; color: var(--text);
    background: transparent;
  }
  .add-task-input::placeholder { color: #bcc8d8; }
  .add-priority {
    border: none; background: transparent; outline: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; color: var(--muted); cursor: pointer;
    padding: 4px 6px; border-radius: 5px;
    border: 1px solid var(--border);
  }
  .btn-add-task {
    padding: 6px 16px;
    background: var(--navy); color: #fff;
    border: none; border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-add-task:hover { background: var(--navy2); }

  /* FILTER TABS */
  .todo-filters {
    display: flex; gap: 4px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 1rem;
  }
  .todo-filter-btn {
    padding: 7px 16px; border: none; background: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px; transition: all 0.15s;
  }
  .todo-filter-btn.active { color: var(--navy); border-bottom-color: var(--navy); }
  .todo-filter-btn:hover { color: var(--text); }

  /* TASK ITEMS */
  .task-group { margin-bottom: 1.5rem; }
  .task-group-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
    padding: 0 4px;
  }
  .task-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 6px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .task-item:hover { border-color: #b8cce0; box-shadow: 0 2px 8px rgba(15,42,74,0.06); }
  .task-item.done { opacity: 0.55; }
  .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

  .task-check-btn {
    width: 20px; height: 20px; flex-shrink: 0;
    border-radius: 50%; border: 2px solid var(--border);
    background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; margin-top: 1px;
  }
  .task-check-btn:hover { border-color: var(--navy3); }
  .task-item.done .task-check-btn {
    background: var(--green-fg); border-color: var(--green-fg);
  }
  .task-check-btn svg { display: none; }
  .task-item.done .task-check-btn svg { display: block; }

  .task-body { flex: 1; min-width: 0; }
  .task-text { font-size: 14px; color: var(--text); line-height: 1.4; word-break: break-word; }
  .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .task-date { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .priority-badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 10px;
    cursor: pointer; user-select: none;
    transition: opacity 0.15s;
  }
  .priority-badge:hover { opacity: 0.75; }
  .p-high   { background: var(--red-bg);    color: var(--red-fg); }
  .p-medium { background: var(--amber-bg);  color: var(--amber-fg); }
  .p-low    { background: var(--green-bg);  color: var(--green-fg); }

  .task-del-btn {
    width: 26px; height: 26px; flex-shrink: 0;
    border: none; background: transparent;
    cursor: pointer; color: var(--muted);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all 0.15s;
  }
  .task-item:hover .task-del-btn { opacity: 1; }
  .task-del-btn:hover { color: var(--red-fg); background: var(--red-bg); }
  .task-del-btn svg { width: 12px; height: 12px; }

  .todo-empty {
    text-align: center; padding: 3rem 1rem;
    color: var(--muted);
  }
  .todo-empty svg { margin-bottom: 10px; opacity: 0.3; }
  .todo-empty p { font-size: 14px; font-weight: 500; color: var(--text); }
  .todo-empty span { font-size: 13px; }

  .clear-done-btn {
    font-size: 12px; color: var(--muted);
    background: none; border: none;
    cursor: pointer; padding: 4px 8px;
    border-radius: 5px; transition: all 0.15s;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .clear-done-btn:hover { color: var(--red-fg); background: var(--red-bg); }
  .task-item.task-selected {
    border-color: var(--navy3);
    background: #eef4fb;
    box-shadow: 0 0 0 2px rgba(24,95,165,0.15);
  }
</style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0f2a4a">
</head>
<body data-page="todo">
<div id="page-content">
<div class="todo-wrap">

  <div class="todo-header">
    <div class="todo-header-left">
      <h1>To-Do</h1>
      <p id="todoSubtitle">Loading…</p>
    </div>
    <div class="todo-stats">
      <div class="todo-stat">Open <strong id="statOpen">0</strong></div>
      <div class="todo-stat">Done <strong id="statDone">0</strong></div>
    </div>
  </div>

  <!-- ADD TASK -->
  <div class="add-task-bar">
    <input class="add-task-input" id="taskInput" type="text" placeholder="Add a new task… then press Enter">
    <input type="date" id="taskDueDate" style="border:none;outline:none;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--muted);background:transparent;cursor:pointer;" title="Due date (optional)">
    <select class="add-priority" id="taskPriority">
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="low">Low</option>
    </select>
    <button class="btn-add-task" onclick="addTask()">Add</button>
  </div>

  <!-- FILTERS -->
  <div class="todo-filters">
    <button class="todo-filter-btn active" onclick="setTodoFilter('all', this)">All</button>
    <button class="todo-filter-btn" onclick="setTodoFilter('open', this)">Open</button>
    <button class="todo-filter-btn" onclick="setTodoFilter('high', this)">High Priority</button>
    <button class="todo-filter-btn" onclick="setTodoFilter('done', this)">Completed</button>
    <button class="todo-filter-btn" onclick="setTodoFilter('overdue', this)">Overdue</button>
    <button class="toolbar-delete" id="todoDeleteBtn" onclick="deleteSelectedTask()" disabled style="margin-left:auto">
      <svg viewBox="0 0 12 12" fill="none" width="14" height="14"><path d="M1 3h10M4 3V2h4v1M2.5 3l.8 8h5.4l.8-8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Delete Selected
    </button>
    <button class="clear-done-btn" onclick="clearDone()">Clear completed</button>
  </div>

  <!-- LIST -->
  <div id="taskList"></div>

</div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal-overlay" id="todoConfirmOverlay">
  <div class="modal confirm-modal">
    <div class="confirm-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h3>Delete this task?</h3>
    <p>This cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeTodoConfirm()">Cancel</button>
      <button class="btn-danger" onclick="confirmDeleteTask()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="todo.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
