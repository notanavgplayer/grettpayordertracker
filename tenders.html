<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenders — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
  .tenders-layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh);
    overflow: hidden;
  }

  /* ── LIST PANEL ── */
  .tenders-list-panel {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .tenders-list-header {
    padding: 1.25rem 1rem 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .tenders-list-title { font-size: 15px; font-weight: 600; color: var(--navy); }
  .btn-new-tender {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--navy); color: #fff;
    border: none; border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.15s;
  }
  .btn-new-tender:hover { background: var(--navy2); }

  .tenders-filters {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 5px; flex-wrap: wrap;
  }
  .t-filter-btn {
    padding: 4px 10px; border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 11px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    transition: all 0.15s;
  }
  .t-filter-btn.active, .t-filter-btn:hover {
    background: var(--navy); color: #fff; border-color: var(--navy);
  }

  .tenders-search {
    margin: 8px 10px 4px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; color: var(--text);
    background: var(--bg); outline: none;
    width: calc(100% - 20px);
  }
  .tenders-search:focus { border-color: var(--navy3); background: #fff; }

  .tenders-list { flex: 1; overflow-y: auto; padding: 6px 8px 8px; }

  .tender-item {
    padding: 12px 12px;
    border-radius: var(--radius-lg);
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 4px;
    transition: all 0.1s;
  }
  .tender-item:hover { background: var(--bg); }
  .tender-item.active { background: #eef4fb; border-color: #c5daf5; }

  .tender-item-top {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 8px;
    margin-bottom: 5px;
  }
  .tender-item-name {
    font-size: 13px; font-weight: 500; color: var(--navy);
    line-height: 1.3; flex: 1;
  }
  .tender-item-agency { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .tender-item-bottom {
    display: flex; align-items: center; justify-content: space-between;
  }
  .tender-item-value {
    font-size: 12px; font-weight: 500;
    color: var(--navy2); font-family: 'IBM Plex Mono', monospace;
  }
  .tender-item-date { font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .tenders-empty {
    text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 13px;
  }

  /* ── PREVIEW PANEL ── */
  .tenders-preview-panel {
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .preview-placeholder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); gap: 10px;
  }
  .preview-placeholder svg { opacity: 0.25; }
  .preview-placeholder p { font-size: 14px; }
  .preview-placeholder span { font-size: 12px; }

  .preview-content {
    display: none; flex-direction: column; flex: 1; overflow-y: auto;
  }
  .preview-header {
    background: var(--navy); padding: 1.25rem 1.5rem;
    flex-shrink: 0;
  }
  .preview-status-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .preview-name {
    font-size: 17px; font-weight: 600; color: #fff;
    line-height: 1.3; margin-bottom: 4px;
  }
  .preview-agency { font-size: 12px; color: rgba(255,255,255,0.55); }
  .preview-open-btn {
    display: flex; align-items: center; gap: 6px;
    margin-top: 1rem;
    padding: 8px 18px;
    background: var(--amber); color: var(--navy);
    border: none; border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
    width: fit-content;
  }
  .preview-open-btn:hover { background: #f0a820; }

  .preview-body { padding: 1.25rem 1.5rem; flex: 1; }

  .preview-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 1.25rem;
  }
  .preview-stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px;
  }
  .preview-stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .preview-stat-val { font-size: 14px; font-weight: 600; color: var(--navy); font-family: 'IBM Plex Mono', monospace; }

  .preview-section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px; margin-top: 1rem;
  }
  .preview-checklist-mini { display: flex; flex-direction: column; gap: 4px; }
  .preview-check-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text);
  }
  .mini-check {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .mini-check.done { background: var(--green-fg); border-color: var(--green-fg); }
  .mini-check.done::after { content: '✓'; color: #fff; font-size: 8px; font-weight: 700; }

  /* STATUS BADGES */
  .s-bidding   { background: #e6f1fb; color: #185fa5; }
  .s-submitted { background: #fdf3dc; color: #7a4500; }
  .s-awarded   { background: #e8f7f1; color: #0e6b4a; }
  .s-lost      { background: #fceaea; color: #c0392b; }
  .s-cancelled { background: #f4f6f9; color: #6b7a90; }

  /* ADD TENDER MODAL */
  .modal-wide { max-width: 560px; }

  @media (max-width: 900px) {
    .tenders-layout { grid-template-columns: 1fr; }
    .tenders-preview-panel { display: none; }
  }

  /* SELECT MODE */
  .btn-tender-select {
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: all 0.15s;
  }
  .btn-tender-select:hover { border-color: var(--navy3); color: var(--navy); }
  .btn-tender-select.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .tender-item.selectable { cursor: pointer; }
  .tender-item.selectable::before {
    content: ''; display: block; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border);
    background: var(--surface); transition: all 0.15s;
  }
  .tender-item.selectable { position: relative; padding-left: 36px !important; }
  .tender-item.selected { background: var(--blue-bg) !important; border-color: var(--blue-fg); }
  .tender-item.selected::before { background: var(--navy); border-color: var(--navy); }

  /* BULK BAR */
  .tender-bulk-bar {
    position: fixed; bottom: -80px; left: 50%; transform: translateX(-50%);
    z-index: 300; transition: bottom 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  .tender-bulk-bar.show { bottom: 1.5rem; pointer-events: all; }
  .tender-bulk-inner {
    display: flex; align-items: center; gap: 10px;
    background: var(--navy); border-radius: 40px;
    padding: 8px 12px 8px 20px;
    box-shadow: 0 8px 32px rgba(15,42,74,0.35);
    white-space: nowrap;
  }
  .tender-bulk-count { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 500; }
  .tender-bulk-count span { font-weight: 700; color: #fff; }
  .tender-bulk-status {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 12px;
    padding: 5px 8px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1); color: #fff;
    cursor: pointer; outline: none;
  }
  .tender-bulk-status option { color: var(--navy); background: #fff; }
  .tender-bulk-apply {
    padding: 5px 14px; border: none; border-radius: 20px;
    background: var(--amber); color: var(--navy);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .tender-bulk-apply:hover { opacity: 0.85; }
  .tender-bulk-del {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 14px; border: none; border-radius: 20px;
    background: var(--red-fg); color: #fff;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .tender-bulk-del:hover { opacity: 0.85; }
  .tender-bulk-cancel {
    padding: 5px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 500;
    cursor: pointer;
  }
  .tender-bulk-cancel:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body data-page="tenders">
<div id="page-content">
  <div class="tenders-layout">

    <!-- LIST -->
    <div class="tenders-list-panel">
      <div class="tenders-list-header">
        <span class="tenders-list-title">Tenders</span>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn-tender-select" id="tenderSelectBtn" onclick="toggleTenderSelect()" title="Select multiple">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7.5l3 3 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn-new-tender" onclick="openAddModal()">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            New Tender
          </button>
        </div>
      </div>

      <div class="tenders-filters">
        <button class="t-filter-btn active" onclick="setTFilter('all',this)">All</button>
        <button class="t-filter-btn" onclick="setTFilter('Bidding',this)">Bidding</button>
        <button class="t-filter-btn" onclick="setTFilter('Submitted',this)">Submitted</button>
        <button class="t-filter-btn" onclick="setTFilter('Awarded',this)">Awarded</button>
        <button class="t-filter-btn" onclick="setTFilter('Lost',this)">Lost</button>
      </div>

      <input class="tenders-search" type="text" id="tenderSearch" placeholder="Search tenders…" oninput="renderTenderList()">
      <div class="tenders-list" id="tenderList"></div>
    </div>

    <!-- PREVIEW -->
    <div class="tenders-preview-panel" id="previewPanel">
      <div class="preview-placeholder" id="previewPlaceholder">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none"><rect x="10" y="8" width="36" height="40" rx="4" stroke="#c8d3e0" stroke-width="2"/><path d="M18 20h20M18 28h20M18 36h12" stroke="#c8d3e0" stroke-width="2" stroke-linecap="round"/></svg>
        <p>No tender selected</p>
        <span>Click a tender to preview it</span>
      </div>
      <div class="preview-content" id="previewContent">
        <div class="preview-header">
          <div class="preview-status-row">
            <span class="badge" id="pvStatus">—</span>
          </div>
          <div class="preview-name" id="pvName">—</div>
          <div class="preview-agency" id="pvAgency">—</div>
          <button class="preview-open-btn" id="pvOpenBtn">
            Open Full Page
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 11L11 2M11 2H5M11 2v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="preview-body">
          <div class="preview-grid">
            <div class="preview-stat"><div class="preview-stat-label">Tender Value</div><div class="preview-stat-val" id="pvValue">—</div></div>
            <div class="preview-stat"><div class="preview-stat-label">NIT / Ref</div><div class="preview-stat-val" id="pvNit" style="font-size:11px">—</div></div>
            <div class="preview-stat"><div class="preview-stat-label">Submission Date</div><div class="preview-stat-val" id="pvSubDate" style="font-size:12px">—</div></div>
            <div class="preview-stat"><div class="preview-stat-label">Linked PO</div><div class="preview-stat-val" id="pvPO" style="font-size:12px">—</div></div>
          </div>
          <div class="preview-section-title">Document Checklist</div>
          <div class="preview-checklist-mini" id="pvChecklist"></div>
          <div class="preview-section-title" style="margin-top:1rem">Contact Person</div>
          <div style="font-size:13px;color:var(--text)" id="pvContact">—</div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ADD TENDER MODAL -->
<div class="modal-overlay" id="addTenderOverlay">
  <div class="modal modal-wide">
    <div class="modal-header">
      <span>New Tender</span>
      <button class="modal-close" onclick="closeAddModal()">&#x2715;</button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Tender Name / Title</label>
        <input type="text" id="tf_name" placeholder="e.g. Supply of LED Street Lights — District South">
      </div>
      <div class="form-group">
        <label>NIT / Reference No.</label>
        <input type="text" id="tf_nit" placeholder="e.g. NIT-KMC-2024-041">
      </div>
      <div class="form-group">
        <label>Procuring Agency</label>
        <input type="text" id="tf_agency" placeholder="e.g. KMC, NHA, PWD">
      </div>
      <div class="form-group">
        <label>Tender Value (PKR)</label>
        <input type="number" id="tf_value" placeholder="0">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="tf_status">
          <option value="Bidding">Bidding</option>
          <option value="Submitted">Submitted</option>
          <option value="Awarded">Awarded</option>
          <option value="Lost">Lost</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
      <div class="form-group">
        <label>Submission Date</label>
        <input type="date" id="tf_subdate">
      </div>
      <div class="form-group">
        <label>Opening Date</label>
        <input type="date" id="tf_opendate">
      </div>
      <div class="form-group">
        <label>Linked Pay Order No.</label>
        <input type="text" id="tf_po" placeholder="e.g. 18550818">
      </div>
      <div class="form-group full">
        <label>Checklist Template</label>
        <select id="tf_template">
          <option value="">— None (empty checklist) —</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Contact Person</label>
        <input type="text" id="tf_contact" placeholder="Name — Phone — Email">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn-save" id="addTenderBtn" onclick="saveTender()">Create Tender</button>
    </div>
  </div>
</div>

<!-- BULK ACTION BAR -->
<div class="tender-bulk-bar" id="tenderBulkBar">
  <div class="tender-bulk-inner">
    <span class="tender-bulk-count"><span id="tBulkCount">0</span> selected</span>
    <select class="tender-bulk-status" id="tBulkStatus">
      <option value="">Change status…</option>
      <option value="Bidding">Bidding</option>
      <option value="Submitted">Submitted</option>
      <option value="Awarded">Awarded</option>
      <option value="Lost">Lost</option>
      <option value="Cancelled">Cancelled</option>
    </select>
    <button class="tender-bulk-apply" onclick="applyBulkStatus()">Apply</button>
    <button class="tender-bulk-del" onclick="bulkDeleteTenders()">
      <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M1 3h10M4 3V2h4v1M2.5 3l.8 8h5.4l.8-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Delete
    </button>
    <button class="tender-bulk-cancel" onclick="toggleTenderSelect()">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="tenders.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
