<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="layout.css" as="style">
<link rel="preload" href="style.css" as="style">
<link rel="modulepreload" href="firebase-config.js">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
  .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
  .skeleton-card{height:72px;margin-bottom:12px;border-radius:10px}
  .skeleton-line{height:14px;margin-bottom:10px}
  .skeleton-line:last-child{width:60%}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  [data-theme="dark"] .skeleton{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%}
</style>
<style>
  .contacts-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── LIST PANEL ── */
  .contacts-list-panel {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .contacts-list-header {
    padding: 1.25rem 1rem 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .contacts-list-title { font-size: 15px; font-weight: 600; color: var(--navy); }
  .btn-new-contact {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--navy); color: #fff;
    border: none; border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.15s;
  }
  .btn-new-contact:hover { background: var(--navy2); }

  .contacts-cat-filters {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .cat-filter-btn {
    padding: 3px 10px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 11px; font-weight: 500; color: var(--muted);
    cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
    transition: all 0.15s;
  }
  .cat-filter-btn.active, .cat-filter-btn:hover {
    background: var(--navy); color: #fff; border-color: var(--navy);
  }

  .contacts-search {
    margin: 8px 10px 4px;
    padding: 7px 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; color: var(--text);
    background: var(--bg); outline: none;
    width: calc(100% - 20px);
  }
  .contacts-search:focus { border-color: var(--navy3); background: #fff; }

  .contacts-list { flex: 1; overflow-y: auto; padding: 6px 8px 8px; }

  .contact-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px; border-radius: var(--radius-lg);
    cursor: pointer; border: 1px solid transparent;
    margin-bottom: 4px; transition: all 0.1s;
  }
  .contact-item:hover { background: var(--bg); }
  .contact-item.active { background: #eef4fb; border-color: #c5daf5; }
  .contact-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 13px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── CATEGORY COLORS ── */
  .cat-agency      { background: var(--blue-bg);   color: var(--blue-fg); }
  .cat-consultant  { background: var(--green-bg);  color: var(--green-fg); }
  .cat-supplier    { background: var(--amber-bg);  color: var(--amber-fg); }
  .cat-subcontractor { background: var(--purple-bg); color: var(--purple-fg); }
  .cat-other       { background: #f4f6f9;           color: var(--muted); }

  /* ── DETAIL PANEL ── */
  .contacts-detail-panel {
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .detail-placeholder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); gap: 10px;
  }
  .detail-placeholder svg { opacity: 0.25; }
  .detail-placeholder p { font-size: 14px; }
  .detail-placeholder span { font-size: 12px; }

  .contact-detail { padding: 1.5rem; display: none; }

  /* detail card */
  .contact-card-header {
    background: var(--navy); border-radius: var(--radius-lg);
    padding: 1.5rem; margin-bottom: 1rem;
    display: flex; align-items: center; gap: 16px;
  }
  .contact-card-avatar {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; flex-shrink: 0;
    border: 3px solid rgba(255,255,255,0.15);
  }
  .contact-card-name { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .contact-card-title { font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 8px; }
  .contact-card-actions { display: flex; gap: 8px; margin-left: auto; }
  .btn-card-action {
    padding: 6px 14px; border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all 0.15s; display: flex; align-items: center; gap: 5px;
  }
  .btn-edit-contact {
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-edit-contact:hover { background: rgba(255,255,255,0.2); }
  .btn-del-contact {
    background: rgba(192,57,43,0.2); color: #ff8a80;
    border: 1px solid rgba(192,57,43,0.3);
  }
  .btn-del-contact:hover { background: rgba(192,57,43,0.35); }

  /* info fields */
  .contact-info-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 1rem;
  }
  .contact-info-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 12px 14px;
  }
  .contact-info-label { font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .contact-info-val { font-size: 13px; font-weight: 500; color: var(--navy); word-break: break-all; }
  .contact-info-val a { color: var(--blue-fg); text-decoration: none; }
  .contact-info-val a:hover { text-decoration: underline; }

  .contact-notes-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px;
  }
  .contact-notes-title { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .contact-notes-body { font-size: 13px; color: var(--text); line-height: 1.65; white-space: pre-wrap; }

  .contacts-empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 13px; }

  @media (max-width: 900px) {
    .contacts-layout { grid-template-columns: 1fr; }
    .contacts-detail-panel { display: none; }
  }
</style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0f2a4a">
</head>
<body data-page="contacts">
<div id="page-content">
<div class="contacts-layout">

  <!-- LIST -->
  <div class="contacts-list-panel">
    <div class="contacts-list-header">
      <span class="contacts-list-title">Contacts</span>
      <button class="btn-new-contact" onclick="openContactModal()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New Contact
      </button>
    </div>
    <div class="contacts-cat-filters">
      <button class="cat-filter-btn active" onclick="setCatFilter('all',this)">All</button>
      <button class="cat-filter-btn" onclick="setCatFilter('Agency Officer',this)">Agency</button>
      <button class="cat-filter-btn" onclick="setCatFilter('Consultant',this)">Consultant</button>
      <button class="cat-filter-btn" onclick="setCatFilter('Supplier',this)">Supplier</button>
      <button class="cat-filter-btn" onclick="setCatFilter('Subcontractor',this)">Subcontractor</button>
    </div>
    <input class="contacts-search" type="text" id="contactSearch" placeholder="Search contacts…" oninput="renderContactList()">
    <div class="contacts-list" id="contactList"></div>
  </div>

  <!-- DETAIL -->
  <div class="contacts-detail-panel" id="contactDetailPanel">
    <div class="detail-placeholder" id="contactPlaceholder">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="20" r="10" stroke="#c8d3e0" stroke-width="2"/><path d="M8 48c0-11 9-20 20-20s20 9 20 20" stroke="#c8d3e0" stroke-width="2" stroke-linecap="round"/></svg>
      <p>No contact selected</p>
      <span>Click a contact to view details</span>
    </div>
    <div class="contact-detail" id="contactDetail"></div>
  </div>

</div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="contactModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <span id="contactModalTitle">New Contact</span>
      <button class="modal-close" onclick="closeContactModal()">&#x2715;</button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Full Name</label>
        <input type="text" id="cf_name" placeholder="e.g. Muhammad Ahmed Khan">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="cf_cat">
          <option value="Agency Officer">Agency Officer</option>
          <option value="Consultant">Consultant</option>
          <option value="Supplier">Supplier</option>
          <option value="Subcontractor">Subcontractor</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Designation / Role</label>
        <input type="text" id="cf_role" placeholder="e.g. Procurement Officer">
      </div>
      <div class="form-group">
        <label>Organization</label>
        <input type="text" id="cf_org" placeholder="e.g. KMC, NHA, PWD">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="cf_phone" placeholder="+92 300 0000000">
      </div>
      <div class="form-group">
        <label>WhatsApp</label>
        <input type="text" id="cf_whatsapp" placeholder="+92 300 0000000">
      </div>
      <div class="form-group full">
        <label>Email</label>
        <input type="email" id="cf_email" placeholder="contact@agency.gov.pk">
      </div>
      <div class="form-group full">
        <label>Office Address</label>
        <input type="text" id="cf_address" placeholder="Full office address">
      </div>
      <div class="form-group full">
        <label>Notes</label>
        <textarea id="cf_notes" style="min-height:64px" placeholder="Any useful notes about this contact…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeContactModal()">Cancel</button>
      <button class="btn-save" id="contactSaveBtn" onclick="saveContact()">Save Contact</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="modal-overlay" id="contactConfirmOverlay">
  <div class="modal confirm-modal">
    <div class="confirm-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h3>Delete this contact?</h3>
    <p>This cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeContactConfirm()">Cancel</button>
      <button class="btn-danger" onclick="confirmDeleteContact()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="contacts.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
