<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .notes-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    height: calc(100vh - 0px);
    overflow: hidden;
  }

  /* ── NOTES SIDEBAR ── */
  .notes-list-panel {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .notes-list-header {
    padding: 1.25rem 1rem 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .notes-list-title { font-size: 15px; font-weight: 600; color: var(--navy); }
  .btn-new-note {
    width: 30px; height: 30px;
    background: var(--navy);
    border: none; border-radius: 7px;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1;
    transition: background 0.15s;
  }
  .btn-new-note:hover { background: var(--navy2); }
  .notes-search {
    margin: 8px 10px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; color: var(--text);
    background: var(--bg); outline: none; width: calc(100% - 20px);
  }
  .notes-search:focus { border-color: var(--navy3); background: #fff; }
  .notes-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .note-item {
    padding: 10px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.1s;
    border: 1px solid transparent;
    margin-bottom: 3px;
  }
  .note-item:hover { background: var(--bg); }
  .note-item.active { background: #eef4fb; border-color: #c5daf5; }
  .note-item-title {
    font-size: 13px; font-weight: 500;
    color: var(--navy); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .note-item-preview {
    font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note-item-date { font-size: 10px; color: var(--muted); margin-top: 4px; font-family: 'IBM Plex Mono', monospace; }
  .notes-empty-list {
    text-align: center; padding: 2rem 1rem;
    color: var(--muted); font-size: 13px;
  }

  /* ── EDITOR ── */
  .notes-editor-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface);
  }
  .editor-toolbar {
    padding: 10px 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .editor-meta { display: flex; align-items: center; gap: 10px; }
  .editor-date { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .editor-actions { display: flex; gap: 6px; }
  .btn-icon-sm {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: all 0.15s;
  }
  .btn-icon-sm:hover { border-color: var(--navy3); color: var(--navy); }
  .btn-icon-sm.del:hover { border-color: var(--red-fg); color: var(--red-fg); background: var(--red-bg); }
  .btn-icon-sm svg { width: 13px; height: 13px; }
  .note-title-input {
    width: 100%;
    padding: 1rem 1.25rem 0.5rem;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 20px; font-weight: 600;
    color: var(--navy); border: none; outline: none;
    background: transparent;
    flex-shrink: 0;
  }
  .note-title-input::placeholder { color: #c8d3e0; }
  .note-body-input {
    flex: 1;
    padding: 0.25rem 1.25rem 1.25rem;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px; line-height: 1.75;
    color: var(--text); border: none; outline: none;
    background: transparent;
    resize: none;
    overflow-y: auto;
  }
  .note-body-input::placeholder { color: #c8d3e0; }

  .editor-placeholder {
    flex: 1; display: flex;
    flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); gap: 10px;
  }
  .editor-placeholder svg { opacity: 0.3; }
  .editor-placeholder p { font-size: 14px; }
  .editor-placeholder span { font-size: 12px; }

  .save-indicator {
    font-size: 11px; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    padding: 0 1.25rem 0.75rem;
    flex-shrink: 0;
  }
  .save-indicator.saving { color: var(--amber-fg); }
  .save-indicator.saved  { color: var(--green-fg); }

  @media (max-width: 768px) {
    .notes-layout { grid-template-columns: 1fr; }
    .notes-list-panel { display: none; }
    .notes-list-panel.mobile-show { display: flex; position: fixed; inset: 0; z-index: 50; }
  }
</style>
</head>
<body data-page="notes">
<div id="page-content">
  <div class="notes-layout">

    <!-- LIST PANEL -->
    <div class="notes-list-panel">
      <div class="notes-list-header">
        <span class="notes-list-title">Notes</span>
        <button class="btn-new-note" onclick="newNote()" title="New Note">+</button>
      </div>
      <input class="notes-search" type="text" id="notesSearch" placeholder="Search notes…" oninput="filterNotes()">
      <div class="notes-list" id="notesList"></div>
    </div>

    <!-- EDITOR PANEL -->
    <div class="notes-editor-panel" id="editorPanel">
      <div class="editor-placeholder" id="editorPlaceholder">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="10" y="8" width="28" height="32" rx="3" stroke="#c8d3e0" stroke-width="2"/><path d="M17 18h14M17 24h14M17 30h10" stroke="#c8d3e0" stroke-width="2" stroke-linecap="round"/></svg>
        <p>No note selected</p>
        <span>Select a note or create a new one</span>
      </div>
      <div id="editorContent" style="display:none; flex-direction:column; flex:1; overflow:hidden; display:none">
        <div class="editor-toolbar">
          <div class="editor-meta">
            <span class="editor-date" id="editorDate">—</span>
          </div>
          <div class="editor-actions">
            <button class="btn-icon-sm del" title="Delete note" onclick="deleteNote()">
              <svg viewBox="0 0 12 12" fill="none"><path d="M1 3h10M4 3V2h4v1M2.5 3l.8 8h5.4l.8-8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <input class="note-title-input" id="noteTitle" type="text" placeholder="Note title…">
        <textarea class="note-body-input" id="noteBody" placeholder="Start writing…"></textarea>
        <div class="save-indicator" id="saveIndicator">Auto-saved</div>
      </div>
    </div>

  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal-overlay" id="noteConfirmOverlay">
  <div class="modal confirm-modal">
    <div class="confirm-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h3>Delete this note?</h3>
    <p>This cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeNoteConfirm()">Cancel</button>
      <button class="btn-danger" onclick="confirmDeleteNote()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="notes.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
