<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Grett Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="layout.css" as="style">
<link rel="preload" href="style.css" as="style">
<link rel="modulepreload" href="firebase-config.js">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
  .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
  .skeleton-card{height:72px;margin-bottom:12px;border-radius:10px}
  .skeleton-line{height:14px;margin-bottom:10px}
  .skeleton-line:last-child{width:60%}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  [data-theme="dark"] .skeleton{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%}
</style>
<style>
  .reports-wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

  .reports-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px;
  }
  .reports-header h1 { font-size: 20px; font-weight: 600; color: var(--navy); }

  .year-nav {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 5px 8px;
  }
  .year-nav-btn {
    width: 26px; height: 26px; border-radius: 6px;
    border: none; background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: all 0.15s;
  }
  .year-nav-btn:hover { background: var(--bg); color: var(--navy); }
  .year-label { font-size: 14px; font-weight: 600; color: var(--navy); min-width: 50px; text-align: center; }

  /* ── TOP STATS ── */
  .top-stats {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 10px; margin-bottom: 1.5rem;
  }
  .top-stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1rem 1.1rem;
    border-top: 3px solid var(--border);
  }
  .top-stat.navy  { border-top-color: var(--navy); }
  .top-stat.green { border-top-color: #1d9e75; }
  .top-stat.red   { border-top-color: var(--red-fg); }
  .top-stat.amber { border-top-color: var(--amber); }
  .top-stat.blue  { border-top-color: var(--blue-fg); }
  .ts-label { font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .ts-val   { font-size: 22px; font-weight: 600; color: var(--navy); font-family: 'IBM Plex Mono', monospace; }
  .top-stat.green .ts-val { color: var(--green-fg); }
  .top-stat.red   .ts-val { color: var(--red-fg); }
  .top-stat.amber .ts-val { color: var(--amber-fg); }
  .top-stat.blue  .ts-val { color: var(--blue-fg); }
  .ts-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* ── SECTION PANEL ── */
  .report-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden;
    margin-bottom: 1rem;
  }
  .report-panel-header {
    padding: 12px 16px; background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .report-panel-title { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .report-panel-body { padding: 1.25rem; }

  /* ── BAR CHART ── */
  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-bottom: 4px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar-stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
  .bar-seg { border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.4s; }
  .bar-seg.won  { background: #1d9e75; border-radius: 3px 3px 0 0; }
  .bar-seg.lost { background: var(--red-fg); }
  .bar-seg.bid  { background: var(--blue-fg); }
  .bar-seg.cancelled { background: var(--border); }
  .bar-label { font-size: 9px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .bar-val   { font-size: 9px; font-weight: 600; color: var(--navy); font-family: 'IBM Plex Mono', monospace; }

  /* ── LEGEND ── */
  .chart-legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend-dot  { width: 8px; height: 8px; border-radius: 2px; }

  /* ── 2 COL GRID ── */
  .reports-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }

  /* ── TABLE IN REPORT ── */
  .report-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .report-table th { padding: 7px 10px; background: var(--bg); text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  .report-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .report-table tr:last-child td { border-bottom: none; }

  /* ── DONUT PROXY (horizontal bar) ── */
  .horiz-bar-item { margin-bottom: 10px; }
  .horiz-bar-top  { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .horiz-bar-name { color: var(--text); font-weight: 500; }
  .horiz-bar-val  { color: var(--navy); font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .horiz-bar-bg   { height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .horiz-bar-fill { height: 100%; border-radius: 10px; transition: width 0.4s; }

  .no-data { font-size: 13px; color: var(--muted); text-align: center; padding: 1.5rem; }

  @media (max-width: 900px) {
    .top-stats { grid-template-columns: repeat(3,1fr); }
    .reports-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .top-stats { grid-template-columns: repeat(2,1fr); }
  }
</style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0f2a4a">
</head>
<body data-page="reports">
<div id="page-content" role="main">
<div class="reports-wrap">

  <div class="reports-header">
    <h1>Reports</h1>
    <div class="year-nav">
      <button class="year-nav-btn" onclick="changeYear(-1)">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 2L4 6l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="year-label" id="yearLabel">—</span>
      <button class="year-nav-btn" onclick="changeYear(1)">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- TOP STATS -->
  <div class="top-stats">
    <div class="top-stat navy"><div class="ts-label">Total Tenders</div><div class="ts-val" id="rsTotalTenders">—</div><div class="ts-sub" id="rsTenderSub">—</div></div>
    <div class="top-stat green"><div class="ts-label">Awarded</div><div class="ts-val" id="rsWon">—</div><div class="ts-sub" id="rsWonRate">—</div></div>
    <div class="top-stat red"><div class="ts-label">Lost</div><div class="ts-val" id="rsLost">—</div></div>
    <div class="top-stat amber"><div class="ts-label">Total Bid Value</div><div class="ts-val" id="rsBidValue">—</div></div>
    <div class="top-stat blue"><div class="ts-label">Total Expenses</div><div class="ts-val" id="rsExpenses">—</div><div class="ts-sub">this year</div></div>
    <div class="top-stat amber"><div class="ts-label">Tender Fees Paid</div><div class="ts-val" id="rsFees">—</div><div class="ts-sub">this year</div></div>
  </div>

  <!-- MONTHLY TENDER CHART -->
  <div class="report-panel">
    <div class="report-panel-header">
      <span class="report-panel-title">Monthly Tender Activity</span>
    </div>
    <div class="report-panel-body">
      <div class="bar-chart" id="tenderBarChart"></div>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#1d9e75"></div>Awarded</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--red-fg)"></div>Lost</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--blue-fg)"></div>Bidding/Submitted</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div>Cancelled</div>
      </div>
    </div>
  </div>

  <!-- 2 COL: Pay Orders + Expenses -->
  <div class="reports-grid">
    <div class="report-panel">
      <div class="report-panel-header"><span class="report-panel-title">Pay Orders Summary</span></div>
      <div class="report-panel-body" id="poReport"></div>
    </div>
    <div class="report-panel">
      <div class="report-panel-header"><span class="report-panel-title">Expenses by Category</span></div>
      <div class="report-panel-body" id="expReport"></div>
    </div>
  </div>

  <!-- 2 COL: Top Agencies + Monthly Expenses -->
  <div class="reports-grid">
    <div class="report-panel">
      <div class="report-panel-header"><span class="report-panel-title">Top Agencies (by bid count)</span></div>
      <div class="report-panel-body" id="agencyReport"></div>
    </div>
    <div class="report-panel">
      <div class="report-panel-header"><span class="report-panel-title">Monthly Expenses</span></div>
      <div class="report-panel-body" id="monthlyExpReport"></div>
    </div>
  </div>

</div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="reports.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
